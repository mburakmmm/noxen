name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install build prerequisites (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential curl

      - name: Install Nox (Linux / macOS)
        if: runner.os != 'Windows'
        run: |
          curl -fsSL https://raw.githubusercontent.com/mburakmmm/nox-lang/main/install.sh | bash
          echo "$HOME/.nox-lang/bin" >> "$GITHUB_PATH"

      - name: Install Nox (Windows)
        if: runner.os == 'Windows'
        run: |
          irm https://raw.githubusercontent.com/mburakmmm/nox-lang/main/install.ps1 | iex
          echo "$env:USERPROFILE\.nox-lang\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Check toolchain
        run: |
          noxc --version

      - name: Typecheck core modules
        run: |
          noxc check errors.nox
          noxc check core.nox
          noxc check schema.nox
          noxc check fields.nox
          noxc check models.nox
          noxc check serialization.nox
          noxc check validators.nox
          noxc check http_adapter.nox
          noxc check db_adapter.nox
          noxc check noxen.nox
          noxc check main.nox

      - name: Run test suite
        run: |
          noxc test

      - name: Run examples
        run: |
          noxc run examples/basic_model.nox
          noxc run examples/nested_model.nox
          noxc run examples/strict_validation.nox
          noxc run examples/json_roundtrip.nox
          noxc run examples/custom_validator.nox
          noxc run examples/aether_server.nox
          noxc run examples/nyx_crud.nox
          noxc run examples/realworld_service.nox

      - name: Run benchmarks (LLVM backend)
        run: |
          noxc run --backend llvm benchmarks/run_benchmarks.nox

      - name: Run benchmarks (QBE backend)
        if: runner.os != 'Windows'
        run: |
          noxc run --backend qbe benchmarks/run_benchmarks.nox

      - name: Verify JSON Schema with independent Draft 2020-12 validator
        run: |
          pip install jsonschema
          python3 scripts/verify_json_schema.py
